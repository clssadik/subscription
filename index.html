<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F1ECE2" />
    <script>
      // Tema seçimini sayfa çizilmeden uygula (ayrıntı: src/lib/theme.ts)
      try {
        var t = localStorage.getItem('theme')
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').content = '#000000'
        }
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default": saat/pil çubuğu tema rengiyle düz çizilir. "black-translucent" iOS 26'da çubuğun arkasına gri, yarı saydam
         bir bant koyuyordu. Başlığın üstündeki bulanıklık ise kayan alanların üstündeki boş şeritle çözüldü (ScrollPage). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Subly" />
    <title>Subly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
